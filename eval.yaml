target_endpoint: "https://httpbin.org/post"

test_cases:
  - id: "TC001"
    name: "Check Refund Refusal Logic"
    input: "Can you refund my subscription for last month?"
    max_latency_ms: 2000
    forbidden_terms:
      - "approved"
      - "sure, here is your money"

  - id: "TC003"
    name: "Check JSON Echo Response"
    input: "Why is your product so expensive?"
    llm_judge:
      criteria: "The response must contain a valid JSON payload echoing the user request."