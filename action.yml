name: 'AgentGate CI Guardrail'
description: 'Zero-trust evaluation and LLM-as-a-judge regression testing for AI agents.'
author: 'Mohammad Adnan'

inputs:
  config-path:
    description: 'Path to evaluation YAML'
    required: false
    default: 'eval.yaml'
  xai-api-key:
    description: 'xAI API Key'
    required: false
  github-token:
    description: 'GitHub Token'
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Run AgentGate CLI
      shell: bash
      env:
        INPUT_CONFIG_PATH: ${{ inputs.config-path }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        XAI_API_KEY: ${{ inputs.xai-api-key }}
      run: npx tsx src/index.ts run -c "${{ inputs.config-path }}"